# ============================================================================
# DERSİS — Release Publisher
#
# Creates a GitHub Release with the installer and checksum attached.
#
# Triggers:
#   - Version tags (v*) — automatic release on tag push
#   - Manual dispatch — for re-releasing or testing
#
# This workflow calls build-installer.yml, then publishes the artifacts
# to a GitHub Release.
# ============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0). Must already exist."
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Run the suite against the exact tag being published ────────────
  # ST-SEC-001: ci.yml also triggers on `v*`, but it starts as an independent
  # run on the same ref and nothing consumes its result — a red suite and a
  # published installer were concurrent, unrelated events. `publish` waits on
  # this job instead.
  #
  # It duplicates ci.yml's Validate suite deliberately. `workflow_run` does not
  # chain cleanly off a tag event and resolves the ref a second time; an ubuntu
  # test job costs minutes next to the ~15-minute Windows build that is already
  # running in parallel with it.
  test:
    name: Test the tag
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Qt runs offscreen, which still needs the platform plugin's shared
      # libraries present. tests/conftest.py sandboxes HOME, so nothing here
      # touches a real ~/Documents/Dersis.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not slow"

  # ── Build the installer via the reusable build workflow ────────────
  build:
    name: Build DERSİS Installer
    runs-on: windows-latest
    # ~15 min observed; 3x headroom. windows-latest bills at a 10x multiplier
    # and this job runs .bat files that end in `pause` — `< NUL` is supplied at
    # the build_embed.bat call, but any other console prompt would otherwise sit
    # on GitHub's 360-minute default.
    timeout-minutes: 45

    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_name: ${{ steps.version.outputs.installer_name }}
      checksum_name: ${{ steps.version.outputs.checksum_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ── Version validation ──────────────────────────────────────────
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION '$version' is not valid semver"
            exit 1
          }

          # Determine the tag being released
          $tag = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}" -replace '^v', ''
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
          }

          if ($tag -ne "" -and $tag -ne $version) {
            Write-Error "Tag 'v$tag' does not match VERSION '$version'"
            exit 1
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "installer_name=Dersis_Setup_v$version.exe" >> $env:GITHUB_OUTPUT
          echo "checksum_name=Dersis_Setup_v$version.exe.sha256" >> $env:GITHUB_OUTPUT
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

          Write-Host "Release version: $version"

      # ── Python setup ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Build ───────────────────────────────────────────────────────
      - name: Run build_embed.bat
        shell: cmd
        run: build_embed.bat < NUL

      - name: Verify ortools is importable in build
        shell: pwsh
        run: |
          $dist = "build\Dersis.dist"
          & "$dist\python\python.exe" -c "from ortools.sat.python import cp_model; print('ortools OK:', cp_model.__name__)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "FATAL: ortools is not importable in the embeddable Python build."
            exit 1
          }
          Write-Host "ortools import verified"

      # Dersis.exe is here because the installer's every shortcut points at it.
      # installer.iss:151 (Start Menu), :153 (Desktop) and :160 (post-install
      # "Launch program") all name {app}\Dersis.exe with no fallback, and in the
      # embed lane that file is not a Python build product: build_embed.bat
      # compiles a C# shim at build time. The build-release.yml this workflow
      # replaced did check it; the replacement dropped the line, and nothing
      # else in the chain would have noticed — build_embed.bat exits 0 on a
      # failed shim, and the installer's `-lt 1MB` size gate passes on an
      # installer that is complete apart from the one file users click.
      - name: Verify build output
        shell: pwsh
        run: |
          $dist = "build\Dersis.dist"
          $checks = @(
            "$dist\python\pythonw.exe",
            "$dist\scheduler_gui.py",
            "$dist\VERSION",
            "$dist\scheduler_app",
            "$dist\Dersis.exe",
            "build\version.iss"
          )
          foreach ($f in $checks) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing: $f"
              exit 1
            }
          }
          Write-Host "Build output verified"

      # ── Installer ──────────────────────────────────────────────────
      # The URL is an immutable GitHub release asset and the digest is checked
      # before the file is executed. The old URL, jrsoftware.org/download.php/is.exe,
      # is a redirector: on 2026-08-28 it 302'd to /isdl.php and returned 10478
      # bytes of text/html. Invoke-WebRequest wrote that into innosetup.exe and
      # exited 0; Start-Process then failed "The file or directory is corrupted and
      # unreadable" — which is what killed build-release runs 11 and 13-16.
      # Stay on 6.x. The download page also offers 7.1.0; taking it would be a
      # silent major-version change of the compiler that builds what users run.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $installer = "$env:TEMP\innosetup-6.7.3.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing

          $actual = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "Inno Setup download failed verification.`n  expected $expected`n  actual   $actual`nRefusing to run it."
            exit 1
          }
          Write-Host "Inno Setup 6.7.3 SHA-256 verified: $actual"

          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\InnoSetup" -Wait -NoNewWindow
          echo "C:\InnoSetup" >> $env:GITHUB_PATH

      - name: Build installer
        shell: cmd
        run: '"C:\InnoSetup\iscc.exe" installer.iss'

      - name: Verify installer and generate checksum
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $installer = "Output\Dersis_Setup_v$version.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
          }

          $size = (Get-Item $installer).Length
          if ($size -lt 1MB) {
            Write-Error "Installer too small ($([math]::Round($size/1MB,2)) MB)"
            exit 1
          }

          # Generate checksum
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLower()
          $filename = Split-Path $installer -Leaf
          "$hash  $filename" | Out-File -FilePath "$installer.sha256" -Encoding ascii -NoNewline

          Write-Host "Installer: $filename ($([math]::Round($size/1MB,2)) MB)"
          Write-Host "SHA-256: $hash"

      # ── Upload artifacts for the release job ────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: Output/Dersis_Setup_v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-checksum
          path: Output/Dersis_Setup_v${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error

  # ── Build the macOS distributables (.dmg + .zip), per architecture ─────
  # Runner labels are checked against actions/runner-images' README by
  # tests/test_release_pipeline.py. A label GitHub no longer offers does not
  # fail loudly — the job never starts, and anything that `needs` it is simply
  # never satisfied. `macos-13` was exactly that: retired 2025-12-08
  # (runner-images #13046), which made every `needs: build-macos` unsatisfiable
  # and skipped `publish` entirely.
  build-macos:
    name: Build DERSİS macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15         # Apple Silicon
          - arch: x64
            runner: macos-15-intel   # Intel; the label that replaced macos-13

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build macOS app + dmg + zip
        run: ./build_mac.sh ${{ matrix.arch }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          for f in *.dmg *.zip; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -lh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/Dersis-*-mac-${{ matrix.arch }}.dmg
            dist/Dersis-*-mac-${{ matrix.arch }}.zip
            dist/Dersis-*-mac-${{ matrix.arch }}.dmg.sha256
            dist/Dersis-*-mac-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  # ── Publish GitHub Release ────────────────────────────────────────
  # The `if:` is load-bearing, and so is its shape.
  #
  # A job with no `if:` carries an implicit `success()`: EVERY entry in `needs`
  # must succeed. So the macOS matrix — an optional-but-expected extra — was a
  # hard gate on the Windows release, and the "publishing Windows-only"
  # fallback below could never print, because it lives inside the job that got
  # skipped. `fail-fast: false` does not change that; it stops the sibling leg
  # being cancelled, not the matrix job's conclusion.
  #
  # `!cancelled()` rather than `always()`: `always()` publishes out of a run an
  # operator cancelled mid-flight. And the condition must name `test` as well as
  # `build`, because an `if:` replaces the implicit `success()` for every need
  # at once — gating on `needs.build.result` alone would silently stop waiting
  # for the suite.
  #
  # Nothing downstream fails on a missing macOS artifact: download-artifact@v4
  # only throws for the `name` and `artifact-ids` inputs, so a `pattern:` that
  # matches nothing downloads nothing and succeeds, and the release step sets
  # fail_on_unmatched_files: false.
  publish:
    name: Publish GitHub Release
    needs: [test, build, build-macos]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: release-installer
          path: release-assets/

      - name: Download checksum artifact
        uses: actions/download-artifact@v4
        with:
          name: release-checksum
          path: release-assets/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          path: release-assets/
          merge-multiple: true

      - name: Verify downloaded assets
        run: |
          INSTALLER="release-assets/${{ needs.build.outputs.installer_name }}"
          CHECKSUM="release-assets/${{ needs.build.outputs.checksum_name }}"

          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Installer not found: $INSTALLER"
            ls -la release-assets/
            exit 1
          fi

          if [ ! -f "$CHECKSUM" ]; then
            echo "::error::Checksum not found: $CHECKSUM"
            exit 1
          fi

          # macOS distributables are optional-but-expected; warn (don't fail)
          # if a macOS runner was unavailable, so the Windows release still ships.
          MAC_COUNT=$(ls release-assets/Dersis-*-mac-*.dmg 2>/dev/null | wc -l | tr -d ' ')
          if [ "$MAC_COUNT" = "0" ]; then
            echo "::warning::No macOS .dmg artifacts found — publishing Windows-only."
          else
            echo "Found $MAC_COUNT macOS .dmg artifact(s)."
          fi

          echo "Assets ready for release:"
          ls -lh release-assets/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "DERSİS v${{ needs.build.outputs.version }}"
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/${{ needs.build.outputs.installer_name }}
            release-assets/${{ needs.build.outputs.checksum_name }}
            release-assets/Dersis-*-mac-*.dmg
            release-assets/Dersis-*-mac-*.zip
            release-assets/Dersis-*-mac-*.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
