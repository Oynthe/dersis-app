name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    env:
      # This repository has no secrets configured, so
      # `secrets.CLAUDE_CODE_OAUTH_TOKEN` is empty and the action falls back to
      # direct-Anthropic-API mode, where it aborts with:
      #
      #   Environment variable validation failed:
      #   - Either ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, or workload
      #     identity federation ... is required when using direct Anthropic API.
      #
      # That made every pull request carry a permanently red check for a job
      # that never had the credentials to run — noise that says nothing about
      # the change under review. The steps below are gated so the job SKIPS
      # instead, and starts working on its own the moment the token is added
      # under Settings → Secrets and variables → Actions.
      #
      # The `secrets` context is not available in a job-level `if:`, but it is
      # available here; the comparison yields a plain "true"/"false" string
      # rather than the secret itself, so branching on it leaks nothing.
      HAS_CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Explain why the review did not run
        if: env.HAS_CLAUDE_CREDENTIAL != 'true'
        run: |
          echo "::notice title=Claude Code Review skipped::No CLAUDE_CODE_OAUTH_TOKEN secret is configured for this repository, so the automated review cannot run. Add it under Settings > Secrets and variables > Actions to enable it. Skipping rather than failing, so the check does not report a problem with the pull request itself."

      - name: Checkout repository
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: env.HAS_CLAUDE_CREDENTIAL == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

