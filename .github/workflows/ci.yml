# ============================================================================
# DERSİS — Continuous Integration
#
# Lightweight validation on every push and pull request.
# Fails fast on version/build inconsistencies and import errors.
# ============================================================================

name: CI

# ST-SEC-001: `tags` is load-bearing. Without it a tag push ran zero tests
# while release.yml built and published from that same tag, and the
# "Verify tag matches VERSION" step below — guarded on refs/tags/v — had never
# once executed. A tag gate in a workflow tags cannot trigger gates on nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # ── Version checks ────────────────────────────────────────────────
      - name: Verify VERSION file exists and is valid semver
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found"
            exit 1
          fi

          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          fi

          echo "Version: $VERSION"

      - name: Verify _version.py reads VERSION correctly
        run: |
          RUNTIME_VERSION=$(python -c "from scheduler_app._version import __version__; print(__version__)")
          echo "Runtime version: $RUNTIME_VERSION"

          if [ "$RUNTIME_VERSION" != "$VERSION" ]; then
            echo "::error::_version.py reports '$RUNTIME_VERSION' but VERSION file says '$VERSION'"
            exit 1
          fi

      - name: Verify tag matches VERSION (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag 'v$TAG_VERSION' does not match VERSION file '$VERSION'"
            exit 1
          fi

      # ── Build file checks ─────────────────────────────────────────────
      - name: Verify required build files exist
        run: |
          MISSING=0
          for f in build_embed.bat installer.iss verify_deps.py scheduler_gui.py; do
            if [ ! -f "$f" ]; then
              echo "::error::Required build file missing: $f"
              MISSING=1
            else
              echo "OK: $f"
            fi
          done

          for f in scheduler_app/assets/app_icon.ico installer/LICENSE.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Required asset missing: $f"
              MISSING=1
            else
              echo "OK: $f"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then exit 1; fi

      # ── Import / smoke checks ─────────────────────────────────────────
      - name: Smoke-test core imports
        run: |
          python -c "
          import sys
          failures = []

          # Only test modules that can load on headless Linux.
          # UI modules (PyQt6 widgets) are tested implicitly via the
          # Windows build workflow.
          modules = [
              'scheduler_app._version',
              'scheduler_app.core.models',
              'scheduler_app.core.workflow',
              # ST-ARCH-009: the engine must import with no Qt present. These
              # two reach the i18n leaf and the CP-SAT path, which are exactly
              # what the spawned solver subprocess re-imports from scratch.
              'scheduler_app.i18n.translations',
              'scheduler_app.core.cpsat_scheduler',
              'scheduler_app.data_io.exporter',
              'scheduler_app.plans',
              'scheduler_app.storage',
          ]

          for mod in modules:
              try:
                  __import__(mod)
                  print(f'  [OK] {mod}')
              except Exception as e:
                  print(f'  [FAIL] {mod}: {e}')
                  failures.append(mod)

          if failures:
              print(f'\n{len(failures)} import(s) failed')
              sys.exit(1)
          else:
              print(f'\nAll {len(modules)} imports OK')
          "

      # ── Regression suite ──────────────────────────────────────────────
      # ST-ARCH-001: the audit found zero automated tests. This is the safety
      # net. Qt runs offscreen; tests/conftest.py sandboxes HOME so nothing
      # touches a real ~/Documents/Dersis.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # ── Static typing (ST-ARCH-013) ───────────────────────────────────
      # The Qt-free layers only, gated at zero errors rather than a baseline,
      # because they start at zero. Scope and rationale are in mypy.ini.
      # This also fails if a Qt import reaches the engine, which is the
      # ST-ARCH-009 property caught through a second mechanism.
      - name: Type-check the engine
        run: mypy

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not slow"

      # ── Installer script syntax check ─────────────────────────────────
      - name: Validate installer.iss references
        run: |
          # Verify installer.iss references the correct source directory
          if ! grep -q 'build\\Dersis.dist' installer.iss; then
            echo "::error::installer.iss does not reference build\Dersis.dist"
            exit 1
          fi

          # Verify output naming convention
          if ! grep -q 'Dersis_Setup_v{#AppVersion}' installer.iss; then
            echo "::error::installer.iss output naming does not follow convention"
            exit 1
          fi

          echo "installer.iss references OK"

  # ── Scheduling invariants ───────────────────────────────────────────────
  # The correctness spine. Runs the audit's independent hard-constraint oracle
  # against the production optimizer, including the `slow` presets that the
  # Validate job skips. Separate job so a multi-minute solve never delays the
  # fast feedback. Needs no Qt: core/ and data_io/ import no PyQt6.
  #
  # ST-PERF-001: this job used to run tests/test_scheduler_invariants.py and
  # nothing else, which left 13 of the suite's 19 `slow` tests executing in no
  # CI job at all — including the solver-quality floors that were written for
  # exactly this purpose. See the step at the bottom for the module list and
  # the measured budget.
  engine:
    name: Scheduling invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ST-PERF-001 / ST-ARCH-001. Every module here is `slow`-marked in part,
      # so `pytest -m "not slow"` in the Validate job skips exactly the halves
      # that matter, and before Phase 7 nothing else collected them:
      #
      #   test_scheduler_invariants.py   the hard-constraint oracle (was the
      #                                  only module this job ran)
      #   test_greedy_bounds.py          ST-PERF-004's placement floors
      #                                  (_PLACEMENT_FLOORS: small >= 20,
      #                                  normal >= 72) and ST-SCHED-001's
      #                                  repaired_conflicts == 0, at 80 classes
      #   test_optimizer_determinism.py  ST-SCHED-013's slow reproducibility
      #                                  pins
      #   test_solver_work.py            the check_placement work ratchet, the
      #                                  shipped search budget (one definition,
      #                                  bounds the whole solve, counts the
      #                                  restarts it ran), and a NON-strict
      #                                  xfail on the 80-class configuration
      #
      # Budget, measured end to end rather than summed: this exact command runs
      # 51 passed + 1 xpassed in 496 s on the audit machine, exit 0. (The four
      # budget tests added after the first measurement cost ~8 s of that; the
      # earlier 633 s figure was taken on a differently loaded box.)
      # ubuntu-latest runs this workload 1.87x faster (measured over 11 runs),
      # so the step should land near 4.5 minutes; the step it replaces ran
      # 206 s. Against a 25-minute timeout that leaves ~20 minutes spare.
      #
      # The 80-class node reports xpassed on a fast runner and xfailed on a slow
      # one -- measured, both on the same machine within an hour. Its marker is
      # deliberately NOT strict, so neither outcome fails this step; see the
      # marker's own reason string for what is asserted unconditionally instead.
      #
      # There is exactly one wall-clock assertion in it, and it is deliberate:
      # test_greedy_bounds.py:552, `assert elapsed <= ceiling`, where the
      # ceiling is a 5 s budget plus 25 s of grace. Measured three times on the
      # audit machine under concurrent load: 5.18-5.28 s, a 5.7-5.8x margin, and
      # the failing direction is one-sided (contention can only make elapsed
      # larger, and the elapsed time of a bounded search is dominated by the
      # budget, which does not stretch). Its anti-vacuity floor of 50 search
      # nodes measured 137-149 on the same loaded runs and 158-159 idle, i.e.
      # 2.7-3.2x. Everything else in this job gates on counts, and counts
      # measured 1.000 -- which is the point: runner variance on identical code
      # is 1.36-1.49x, and no useful *threshold* survives that. Do not add a
      # second timing gate without a margin measured the same way.
      - name: Run the invariant oracle and the engine gates (including slow presets)
        run: |
          pytest \
            tests/test_scheduler_invariants.py \
            tests/test_greedy_bounds.py \
            tests/test_optimizer_determinism.py \
            tests/test_solver_work.py
