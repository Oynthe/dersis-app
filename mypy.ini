# ============================================================================
# DERSİS — static type checking (ST-ARCH-013)
#
# Scope: the Qt-free layers only. `ui/` is excluded — it is 10 000 lines of
# PyQt6 widget code at ~5% annotation coverage, and gating it would mean a
# baseline of hundreds of errors that nobody reads.
#
# The gate is ZERO errors, not a baseline, because it starts at zero: the five
# engine packages needed 13 annotations to get there and `storage` and
# `learning` were already clean. A ratchet is the right tool when the debt is
# large; here there is none, and a hard gate is worth more.
#
# What this actually buys, stated honestly. The audit proposes TypedDicts and
# mypy as the remedy for a KeyError on a malformed availability dict and an
# unimported `tr()` NameError. Measured, default mypy catches neither:
#
#   * `--check-untyped-defs` is what finds undefined names, and it reports 164
#     errors on this tree (76 var-annotated, 65 attr-defined, 12 index, 4 misc,
#     3 arg-type, 2 type-var, 1 union-attr, 1 assignment). Zero of them are
#     `[name-defined]`, so the NameError class the finding cites has no
#     remaining instances — Phase 3 fixed the one it names.
#     Re-measured 2026-08-29 with mypy 2.3.1; the previous figures in this
#     block (168 errors, 69 var-annotated) were stale on two of three numbers,
#     which is the argument for writing down the tool version alongside them.
#   * a TypedDict does not catch a missing key at either totality, and is blind
#     to `.get()`, which is over half of all class-dict reads.
#
# So the value here is regression pressure on the engine's own type errors and,
# above all, the layering guarantee: `follow_imports` means a Qt import
# anywhere in these packages fails the check. tests/test_import_layering.py
# asserts the same property structurally; this catches it through a second
# mechanism, which is the point.
# ============================================================================
[mypy]
files = scheduler_app/core, scheduler_app/data_io, scheduler_app/storage, scheduler_app/learning, scheduler_app/i18n
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
show_error_codes = True

# Deliberately NOT enabled, with the measurement that says why:
#   check_untyped_defs = True     -> 164 errors, 0 of them name-defined
#   disallow_untyped_defs = True  -> the whole engine is unannotated by design
# Raising either is a real project, not a config flip. See PROGRESS.md.

# There is deliberately no [mypy-scheduler_app.ui.*] section. One was written,
# to stop the check following imports up into the widget code -- and mypy
# reported it as UNUSED, because after ST-ARCH-009 no module in the five
# packages above imports `ui` at all. The absence of this section is itself a
# statement about the layering, and it will start being needed again the moment
# that stops being true.

[mypy-ortools.*]
ignore_missing_imports = True

[mypy-deepdiff.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True
