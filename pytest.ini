# ============================================================================
# DERSİS — pytest configuration
#
# The suite lives in tests/ and is the regression safety net demanded by
# ST-ARCH-001 (zero automated tests). tests/conftest.py sandboxes HOME before
# anything imports scheduler_app — never run these tests without it.
# ============================================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --durations=10
markers =
    slow: takes more than ~10 s; deselect with -m "not slow"
    ui: needs PyQt6 and a Qt platform plugin (offscreen in CI)
    engine: exercises the scheduling/optimization engine
    excel: needs pandas + openpyxl
    pdf: needs reportlab
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
